services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  feed:
    build:
      context: .
      dockerfile: Dockerfile.self-hosted
      target: jisho
    working_dir: "/tsukuru/"
    volumes:
      - feed_state:/var/lib/tsukuru
    command: ["uv", "run", "/tsukuru/scripts/run_self-host.py"]
    environment:
      REPO_ROOT: /tsukuru/
      DB_URL: postgres://app_user:app_password@postgresql:5432/app_db?sslmode=disable
    depends_on:
      postgresql:
        condition: service_healthy
    restart: "no"

  jisho:
    build:
      context: .
      dockerfile: Dockerfile.self-hosted
      target: jisho
    environment:
      REPO_ROOT: /tsukuru/apps-go/jisho
      DB_URL: postgres://app_user:app_password@postgresql:5432/app_db?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      feed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  feed_state:
